name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"

    services:
      mailcatcher:
        image: syncloudsoftech/mailcatcher
        ports:
          - "1025:1025"
          - "8025:8025"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Wait for MailCatcher
        run: |
          timeout 30 bash -c 'until (echo > /dev/tcp/localhost/1025) 2>/dev/null; do sleep 1; done'
          timeout 30 bash -c 'until curl -s http://localhost:8025 > /dev/null; do sleep 1; done'

      - name: Run tests
        env:
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_REGION: ${{ secrets.MAILGUN_REGION }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: vendor/bin/phpunit --coverage-text
